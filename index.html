<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shaheer Ahmed — Full-Stack Web Developer</title>
<meta name="description" content="Shaheer Ahmed — founder of TechAvanza. Custom WordPress, WooCommerce, Shopify and full-stack web solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style id="app-css">
:root{--a:#00f0ff;--b:#a855f7;--c:#ff2e9f;--bg:#04050b;--fg:#e8ecff;--mut:#8b93b8;--bd:rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.65;overflow-x:hidden;min-height:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
::selection{background:var(--a);color:#000}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--a),var(--b));border-radius:9px}::-webkit-scrollbar-track{background:#070913}

/* backdrop layers */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-3}
.gridov{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
.aurora{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:48vmax;height:48vmax;border-radius:50%;filter:blur(90px);opacity:.16;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a);left:-14vmax;top:-12vmax}
.aurora i:nth-child(2){background:var(--b);right:-16vmax;top:30vh;animation-delay:-6s}
.aurora i:nth-child(3){background:var(--c);left:20vw;bottom:-26vmax;animation-delay:-11s;opacity:.1}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#prog{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));z-index:90;box-shadow:0 0 14px var(--a)}

/* cursor */
.has-cursor,.has-cursor a,.has-cursor button{cursor:none}
#cdot,#cring{position:fixed;left:0;top:0;pointer-events:none;z-index:200;border-radius:50%;opacity:0;transition:opacity .3s}
#cdot{width:7px;height:7px;background:var(--a);margin:-3.5px 0 0 -3.5px;box-shadow:0 0 12px var(--a)}
#cring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid var(--a);transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s}
#cring.big{width:68px;height:68px;margin:-34px 0 0 -34px;background:rgba(0,240,255,.08)}
.has-cursor #cdot,.has-cursor #cring{opacity:1}

/* boot */
#boot{position:fixed;inset:0;z-index:300;background:#03040a;display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#boot.out{opacity:0;visibility:hidden}
.boot-in{width:min(460px,86vw);font-size:.82rem;color:var(--a)}
.boot-in p{opacity:0;animation:fadein .3s forwards;margin-bottom:4px}
.boot-in p:nth-child(1){animation-delay:.1s}.boot-in p:nth-child(2){animation-delay:.5s}.boot-in p:nth-child(3){animation-delay:.9s}.boot-in p:nth-child(4){animation-delay:1.25s}
.boot-bar{height:3px;background:rgba(255,255,255,.08);border-radius:9px;margin-top:16px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));animation:fillbar 1.7s .1s ease-out forwards}
@keyframes fillbar{to{width:100%}}
@keyframes fadein{to{opacity:1}}

/* nav */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:80;transition:background .3s,backdrop-filter .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.sc{background:rgba(4,5,11,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--bd)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:.08em;font-size:1.05rem}
.logo b{color:var(--a);text-shadow:0 0 14px var(--a)}
.links{display:flex;gap:6px}
.links a{padding:8px 14px;border-radius:99px;font-size:.88rem;color:var(--mut);transition:.25s;position:relative}
.links a:hover,.links a.on{color:#fff;background:rgba(255,255,255,.06)}
.links a.on::after{content:"";position:absolute;left:50%;bottom:2px;width:16px;height:2px;margin-left:-8px;background:var(--a);box-shadow:0 0 8px var(--a);border-radius:9px}
.menu-btn{display:none;background:none;border:1px solid var(--bd);border-radius:10px;width:42px;height:42px;font-size:1.2rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:99px;font-weight:700;font-size:.95rem;border:1px solid transparent;background:linear-gradient(100deg,var(--a),var(--b));color:#04050b;position:relative;overflow:hidden;transition:transform .2s,box-shadow .3s;box-shadow:0 0 30px -6px var(--a)}
.btn:hover{box-shadow:0 0 44px -2px var(--a)}
.btn.ghost{background:rgba(255,255,255,.03);color:var(--fg);border-color:var(--bd);box-shadow:none;backdrop-filter:blur(8px)}
.btn.ghost:hover{border-color:var(--a);box-shadow:0 0 30px -10px var(--a)}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::after{left:140%}

/* hero */
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;padding-top:110px;padding-bottom:60px;position:relative}
.hero-l>*{opacity:0}
.go .hero-l>*{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.go .hero-l>*:nth-child(1){animation-delay:.05s}.go .hero-l>*:nth-child(2){animation-delay:.15s}.go .hero-l>*:nth-child(3){animation-delay:.25s}.go .hero-l>*:nth-child(4){animation-delay:.4s}.go .hero-l>*:nth-child(5){animation-delay:.55s}.go .hero-l>*:nth-child(6){animation-delay:.7s}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.badge{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border:1px solid var(--bd);border-radius:99px;background:rgba(255,255,255,.04);font-size:.8rem;color:var(--mut);margin-bottom:22px;backdrop-filter:blur(8px)}
.badge i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 #34d399;animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.greet{color:var(--a);font-size:.95rem;margin-bottom:6px;letter-spacing:.06em}
.glitch{position:relative;font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(2.2rem,5.6vw,4.7rem);line-height:1.05;letter-spacing:.02em;background:linear-gradient(100deg,#fff 0%,var(--a) 40%,var(--b) 70%,#fff 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;margin-bottom:14px;word-break:break-word}
@keyframes shine{to{background-position:220% center}}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;background:none;opacity:0}
.glitch::before{color:var(--c);animation:gl1 6s infinite steps(1)}
.glitch::after{color:var(--a);animation:gl2 6s infinite steps(1)}
@keyframes gl1{0%,91%,100%{opacity:0}92%{opacity:.85;transform:translate(-5px,1px);clip-path:inset(8% 0 62% 0)}94%{opacity:.85;transform:translate(4px,-1px);clip-path:inset(58% 0 12% 0)}96%{opacity:.85;transform:translate(-2px,0);clip-path:inset(30% 0 40% 0)}98%{opacity:0}}
@keyframes gl2{0%,92%,100%{opacity:0}93%{opacity:.8;transform:translate(5px,-1px);clip-path:inset(40% 0 30% 0)}95%{opacity:.8;transform:translate(-4px,1px);clip-path:inset(5% 0 70% 0)}97%{opacity:.8;transform:translate(2px,0);clip-path:inset(65% 0 8% 0)}99%{opacity:0}}
.role{font-size:clamp(1rem,2vw,1.35rem);font-weight:400;color:var(--fg);min-height:2em;margin-bottom:10px}
.caret{display:inline-block;width:10px;height:1.1em;background:var(--a);vertical-align:-3px;margin-left:4px;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px var(--a)}
@keyframes blink{50%{opacity:0}}
.tag{color:var(--mut);max-width:540px;margin-bottom:30px;font-size:1.05rem}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:34px}
.hint{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.72rem;letter-spacing:.3em}
.hint i{display:block;width:22px;height:36px;border:1.5px solid var(--mut);border-radius:14px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;background:var(--a);border-radius:3px;animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
.hero-r{position:relative;height:min(560px,70vh);min-height:340px}
#orb{width:100%;height:100%;display:block}
.chip-f{position:absolute;padding:8px 14px;border:1px solid var(--bd);border-radius:12px;background:rgba(8,10,22,.65);backdrop-filter:blur(10px);font-size:.78rem;display:flex;gap:8px;align-items:center;animation:floaty 6s ease-in-out infinite}
.chip-f::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}
.chip-f:nth-of-type(2){left:2%;top:16%}.chip-f:nth-of-type(3){right:0;top:30%;animation-delay:-2s}.chip-f:nth-of-type(4){left:8%;bottom:14%;animation-delay:-4s}.chip-f:nth-of-type(5){right:6%;bottom:8%;animation-delay:-1s}
.chip-f:nth-of-type(3)::before{background:var(--b);box-shadow:0 0 10px var(--b)}.chip-f:nth-of-type(4)::before{background:var(--c);box-shadow:0 0 10px var(--c)}
@keyframes floaty{50%{transform:translateY(-14px)}}

/* marquee */
.mq{overflow:hidden;border-block:1px solid var(--bd);background:rgba(255,255,255,.02);padding:18px 0;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq-t{display:flex;gap:46px;width:max-content;animation:mq 34s linear infinite}
.mq:hover .mq-t{animation-play-state:paused}
.mq span{font-family:Orbitron,sans-serif;font-size:1.05rem;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.4);white-space:nowrap;transition:.3s}
.mq span:hover{color:var(--a);-webkit-text-stroke:1px var(--a);text-shadow:0 0 20px var(--a)}
.mq span::after{content:"✦";margin-left:46px;color:var(--b);-webkit-text-stroke:0}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section{padding:110px 0;position:relative}
.sh{margin-bottom:56px;max-width:760px}
.sh .mono{color:var(--a);font-size:.85rem;letter-spacing:.2em}
.sh h2{font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(1.8rem,4vw,3rem);line-height:1.15;margin:10px 0 14px}
.sh h2 em{font-style:normal;background:linear-gradient(100deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.sh p{color:var(--mut);font-size:1.05rem}
.reveal{opacity:0;translate:0 46px;transition:opacity .9s cubic-bezier(.2,.8,.2,1),translate .9s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;translate:0 0}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}

/* cards */
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--bd);border-radius:22px;overflow:hidden;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .25s ease-out,border-color .3s,box-shadow .3s;will-change:transform}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac,var(--a)) 24%,transparent),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:1}
.card:hover::before{opacity:1}
.card:hover{border-color:color-mix(in srgb,var(--ac,var(--a)) 55%,transparent);box-shadow:0 0 46px -14px var(--ac,var(--a))}

/* about */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
.about .txt p{color:var(--mut);font-size:1.08rem;margin-bottom:22px}
.pts{list-style:none;display:grid;gap:12px}
.pts li{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.025);transition:.3s}
.pts li:hover{border-color:var(--a);transform:translateX(8px)}
.pts li::before{content:"▸";color:var(--a);text-shadow:0 0 10px var(--a)}
.term{padding:0;margin-bottom:22px}
.term .tb{display:flex;gap:7px;padding:12px 16px;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.03)}
.term .tb i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.term .tb i:nth-child(2){background:#febc2e}.term .tb i:nth-child(3){background:#28c840}
.term pre{padding:18px 20px;font-size:.82rem;color:#b9c4ff;white-space:pre-wrap;line-height:1.8}
.term pre b{color:var(--a);font-weight:400}.term pre u{text-decoration:none;color:#34d399}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{padding:22px;text-align:left}
.stat b{display:block;font-family:Orbitron,sans-serif;font-size:2.1rem;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.82rem;color:var(--mut)}

/* services */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.svc{padding:30px 26px;min-height:270px}
.svc .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac,var(--a)) 30%,transparent),transparent);border:1px solid color-mix(in srgb,var(--ac,var(--a)) 45%,transparent);color:var(--ac,var(--a));text-shadow:0 0 14px var(--ac,var(--a));position:relative;z-index:2}
.svc h3{font-family:Orbitron,sans-serif;font-size:1.05rem;margin-bottom:10px;position:relative;z-index:2}
.svc p{color:var(--mut);font-size:.94rem;position:relative;z-index:2}
.svc .n{position:absolute;right:18px;top:12px;font-family:Orbitron,sans-serif;font-size:2.6rem;font-weight:900;color:rgba(255,255,255,.04);z-index:0}

/* work */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.chip{padding:9px 20px;border-radius:99px;border:1px solid var(--bd);background:rgba(255,255,255,.03);font-size:.85rem;color:var(--mut);transition:.25s}
.chip:hover{color:#fff;border-color:var(--a)}.chip.on{background:linear-gradient(100deg,var(--a),var(--b));color:#04050b;border-color:transparent;font-weight:700}
.projs{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.proj{animation:pop .6s cubic-bezier(.2,.8,.2,1)}
.proj.hide{display:none}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.pc{cursor:pointer;display:block}
.art{position:relative;aspect-ratio:16/10;background:#070913;border-bottom:1px solid var(--bd);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.pc:hover .art img{transform:scale(1.06)}
.art .bar{position:absolute;left:0;right:0;top:0;height:38px;z-index:3;display:flex;align-items:center;gap:6px;padding:0 12px;background:rgba(10,12,24,.8);backdrop-filter:blur(6px)}
.bar i{width:9px;height:9px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{margin-left:10px;font:12px 'JetBrains Mono',monospace;color:var(--mut);background:rgba(255,255,255,.06);padding:2px 12px;border-radius:99px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca{position:absolute;inset:38px 0 0;overflow:hidden}
.blob{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 65%);filter:blur(28px);opacity:.6;animation:drift2 8s ease-in-out infinite alternate}
.blob.b1{left:-12%;top:-26%}.blob.b2{right:-16%;bottom:-36%;animation-delay:-4s;opacity:.42}
@keyframes drift2{to{transform:translate(14%,10%) scale(1.2)}}
.ca::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(circle,#000 25%,transparent 80%);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 80%)}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent);box-shadow:0 0 14px var(--ac);animation:scan 3.6s linear infinite;z-index:2}
@keyframes scan{from{top:-4%}to{top:104%}}
.bt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 16px;font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(1.1rem,2.6vw,1.9rem);text-shadow:0 0 28px var(--ac);z-index:2}
.pi{padding:24px 26px 28px;position:relative;z-index:2}
.pi .num{position:absolute;right:24px;top:18px;font-family:Orbitron,sans-serif;font-weight:900;font-size:2.4rem;color:rgba(255,255,255,.05)}
.cat{font-size:.74rem;color:var(--ac,var(--a));letter-spacing:.16em;text-transform:uppercase}
.pi h3{font-family:Orbitron,sans-serif;font-size:1.35rem;margin:6px 0 8px}
.pi p{color:var(--mut);font-size:.95rem;margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:.72rem;padding:4px 11px;border-radius:99px;border:1px solid var(--bd);color:#b9c4ff;background:rgba(255,255,255,.03)}
.more{display:inline-block;margin-top:18px;font-weight:700;font-size:.88rem;color:var(--ac,var(--a));transition:letter-spacing .3s}
.pc:hover .more{letter-spacing:.06em}

/* process */
.tl{position:relative;max-width:820px;margin-inline:auto;padding-left:40px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:rgba(255,255,255,.1)}
.tl::after{content:"";position:absolute;left:11px;top:6px;width:2px;height:calc((100% - 12px) * var(--pf,0));background:linear-gradient(var(--a),var(--b),var(--c));box-shadow:0 0 14px var(--a)}
.st{position:relative;padding:22px 26px;margin-bottom:22px}
.st::before{content:"";position:absolute;left:-39px;top:30px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--a);box-shadow:0 0 14px var(--a);z-index:3}
.st .k{font-size:.74rem;color:var(--a);letter-spacing:.2em}
.st h3{font-family:Orbitron,sans-serif;font-size:1.15rem;margin:4px 0 6px;position:relative;z-index:2}
.st p{color:var(--mut);position:relative;z-index:2}

/* contact */
.ct{padding:56px 48px;text-align:center;position:relative;overflow:hidden}
.ct h2{font-family:Orbitron,sans-serif;font-size:clamp(1.8rem,4.4vw,3.2rem);line-height:1.15;margin-bottom:14px;position:relative;z-index:2}
.ct>p{color:var(--mut);max-width:620px;margin:0 auto 30px;position:relative;z-index:2}
.ring{position:absolute;left:50%;top:50%;border:1px solid rgba(255,255,255,.07);border-radius:50%;translate:-50% -50%;animation:rot 24s linear infinite}
.ring:nth-child(1){width:420px;height:420px;border-top-color:var(--a)}.ring:nth-child(2){width:660px;height:660px;animation-direction:reverse;border-right-color:var(--b);animation-duration:34s}.ring:nth-child(3){width:900px;height:900px;border-bottom-color:var(--c);animation-duration:46s}
@keyframes rot{to{rotate:360deg}}
.cform{display:grid;gap:14px;max-width:560px;margin:0 auto 26px;text-align:left;position:relative;z-index:2}
.cform input,.cform textarea{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--bd);background:rgba(5,7,16,.7);color:var(--fg);font:inherit;outline:none;transition:.25s}
.cform input:focus,.cform textarea:focus{border-color:var(--a);box-shadow:0 0 24px -8px var(--a)}
.cbtns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;position:relative;z-index:2}
.soc{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px;position:relative;z-index:2}
.soc a{padding:8px 18px;border:1px solid var(--bd);border-radius:99px;font-size:.85rem;color:var(--mut);transition:.25s}
.soc a:hover{color:#fff;border-color:var(--a);box-shadow:0 0 20px -8px var(--a)}
footer{border-top:1px solid var(--bd);padding:30px 0 40px;text-align:center;color:var(--mut);font-size:.85rem}

/* case-study modal */
#modal{position:fixed;inset:0;z-index:150;background:rgba(3,4,10,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#modal.open{opacity:1;visibility:visible}
.cs{width:min(1000px,100% - 28px);margin:calc(env(safe-area-inset-top,0px) + 30px) auto 60px;transform:translateY(40px) scale(.97);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#modal.open .cs{transform:none}
.cs .x{position:sticky;top:12px;float:right;z-index:10;width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:rgba(10,12,24,.85);font-size:1.2rem;margin:0 0 -46px}
.cs .x:hover{border-color:var(--ac);color:var(--ac)}
.cs-top{border-radius:24px;overflow:hidden;border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);box-shadow:0 0 70px -20px var(--ac)}
.cs-top .art{aspect-ratio:16/8}
.cs h2{font-family:Orbitron,sans-serif;font-size:clamp(1.7rem,4vw,2.8rem);margin:26px 0 6px}
.cs .lead{color:var(--mut);font-size:1.12rem;margin-bottom:22px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.meta div{padding:14px 18px;border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.03)}
.meta small{display:block;color:var(--mut);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
.blk{padding:26px 28px;margin-bottom:18px}
.blk h4{font-family:Orbitron,sans-serif;font-size:.92rem;color:var(--ac);letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.blk h4::before{content:"";width:22px;height:2px;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.blk p{color:#c9d0f2;white-space:pre-line;position:relative;z-index:2}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:6px 0 18px}
.mets div{padding:20px;text-align:center;border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);border-radius:16px;background:color-mix(in srgb,var(--ac) 7%,transparent)}
.mets b{display:block;font-family:Orbitron,sans-serif;font-size:1.7rem;color:var(--ac);text-shadow:0 0 18px var(--ac)}
.mets span{font-size:.8rem;color:var(--mut)}
.csn{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.csn button{padding:12px 22px;border-radius:99px;border:1px solid var(--bd);background:rgba(255,255,255,.04);transition:.25s}
.csn button:hover{border-color:var(--a);color:var(--a)}
body.lock{overflow:hidden}

#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:120;padding:13px 20px;border-radius:99px;border:1px solid var(--a);background:rgba(4,5,11,.85);backdrop-filter:blur(12px);color:var(--a);font-weight:700;font-size:.88rem;box-shadow:0 0 30px -6px var(--a);display:none}

#adm{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:160;background:rgba(6,8,18,.96);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-left:1px solid var(--bd);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
#adm.open{transform:none}
.ah{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--bd)}
.ah b{font-family:Orbitron,sans-serif;font-size:.95rem;letter-spacing:.08em}.ah b span{color:var(--a)}

.ab{flex:1;overflow-y:auto;padding:16px 18px 30px}

.ab h5:first-child{margin-top:0}

.fld label{display:block;font-size:.72rem;color:var(--mut);margin-bottom:5px;letter-spacing:.04em}

.fld input:focus,.fld textarea:focus{border-color:var(--a)}
.fld input[type=color]{width:100%;height:38px;border:1px solid var(--bd);border-radius:10px;background:none;padding:2px}

.fld input[type=file]{font-size:.78rem;color:var(--mut)}
.imgf img{height:90px;border-radius:10px;margin-bottom:8px;border:1px solid var(--bd)}
.imgf button{margin-left:8px;padding:4px 10px;border:1px solid var(--bd);border-radius:8px;background:none;font-size:.75rem}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.88rem}
.chk input{accent-color:var(--a);width:17px;height:17px}
.row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
details.li{border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:rgba(255,255,255,.025)}
details.li summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;font-size:.86rem;gap:8px}
details.li summary::-webkit-details-marker{display:none}
details.li[open]{border-color:rgba(0,240,255,.4)}
.acts{display:flex;gap:4px;flex:none}
.acts button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:none;font-size:.78rem}
.acts button:hover{border-color:var(--a)}
.acts button.arm{background:#ff2e4d;border-color:#ff2e4d;color:#fff;width:auto;padding:0 8px}
.li-b{padding:4px 14px 12px}
.add{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--a);background:none;color:var(--a);font-weight:700;font-size:.85rem}
.af{padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--bd);display:grid;gap:10px}
.af .st2{font-size:.78rem;color:var(--mut);min-height:1.2em}.af .st2.err{color:#ff6b81}.af .st2.ok{color:#34d399}

.af .r button.pub{background:linear-gradient(100deg,var(--a),var(--b));color:#04050b;border:none}
.af .r button.arm{background:#ff2e4d;color:#fff;border-color:#ff2e4d}

 $('#admx').onclick=function(){adm.classList.remove('open')};
 $('#admtabs').innerHTML=Object.keys(TABNAMES).map(function(k){return '<button type="button" data-tab="'+k+'">'+TABNAMES[k]+'</button>'}).join('');
 $('#admtabs').onclick=function(e){var b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;renderTab()}};
 var body=$('#admb');
 body.addEventListener('input',function(e){
  var t=e.target,p=t.dataset&&t.dataset.p;if(!p)return;var ty=t.dataset.t,v;
  if(ty==='check')v=t.checked;
  else if(ty==='range'){v=+t.value;if(t.nextElementSibling)t.nextElementSibling.textContent=v}
  else if(ty==='csv')v=t.value.split(',').map(function(s){return s.trim()}).filter(Boolean);
  else if(ty==='lines')v=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  else if(ty==='metrics')v=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean).map(function(s){var i=s.indexOf('|');return i<0?{v:s,l:''}:{v:s.slice(0,i).trim(),l:s.slice(i+1).trim()}});
  else if(ty==='img')return;else v=t.value;
  setp(D,p,v);commit(p);
 });
 body.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset||t.dataset.t!=='img')return;var f=t.files&&t.files[0];if(!f||!assetsNS)return;
  setStatus('Uploading image…');
  assetsNS.upload(f).then(function(r){setp(D,t.dataset.p,'/_blob/'+r.id);commit();renderTab();setStatus('Image uploaded ✓ — remember to publish','ok')}).catch(function(){setStatus('Upload failed (editors only, max 20 MB)','err')});
 });
 body.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();e.stopPropagation();
  var act=b.dataset.act,p=b.dataset.p,i=+b.dataset.i;
  if(act==='clearimg'){setp(D,p,'');commit();renderTab();return}
  var arr=getp(D,p);
  if(act==='add'){arr.push(NEW[p]());commit();renderTab(arr.length-1);return}
  if(act==='up'&&i>0){var t=arr[i];arr[i]=arr[i-1];arr[i-1]=t;commit();renderTab(i-1)}
  else if(act==='down'&&i<arr.length-1){var t2=arr[i];arr[i]=arr[i+1];arr[i+1]=t2;commit();renderTab(i+1)}
  else if(act==='del'){
   if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Sure?';setTimeout(function(){b.classList.remove('arm');b.textContent='✕'},2600);return}
   arr.splice(i,1);commit();renderTab();
  }
 });
 $('#admpub').onclick=publish;
 var rb=$('#admreset');
 rb.onclick=function(){
  if(!rb.classList.contains('arm')){rb.classList.add('arm');rb.textContent='Click again to confirm';setTimeout(function(){rb.classList.remove('arm');rb.textContent='Reset'},2800);return}
  rb.classList.remove('arm');rb.textContent='Reset';D=clone(DEFAULT);applyTheme();bgResize();commit();renderTab();setStatus('Reset to defaults (not published yet)')
 };
 renderTab();
}
function renderTab(open){
 $$('#admtabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
 var sc=$('#admb').scrollTop;
 $('#admb').innerHTML=TABS[tab]();
 if(typeof open==='number'){var ds=$$('#admb details.li');if(ds[open])ds[open].open=true}
 $('#admb').scrollTop=sc;
}
function commit(p){
 dirty=true;setStatus('Unsaved changes — press Publish to go live');
 applyTheme();if(p&&p.indexOf('density')>-1)bgResize();
 clearTimeout(debT);debT=setTimeout(function(){renderContent(true)},180);
}
function buildDoc(){
 var css=$('#app-css').textContent,code=$('#app-code').textContent,json=JSON.stringify(D).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
 var head='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(D.seo.title)+'</title><meta name="description" content="'+esc(D.seo.desc)+'"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">';
 return '<!DOCTYPE html>\n<html lang="en"><head>'+head+'<style id="app-css">'+css+'</style></head><body><div id="app"></div>\n<script id="site-data" type="application/json">'+json+'<\/script>\n<script id="app-code">'+code+'<\/script></body></html>';
}
function publish(){
 if(!artifactNS)return;setStatus('Publishing…');var b=$('#admpub');b.disabled=true;
 artifactNS.publish(buildDoc()).then(function(){setStatus('Published ✓','ok');dirty=false;b.disabled=false}).catch(function(e){b.disabled=false;setStatus(e&&e.code==='conflict'?'Another version was published first — the page will reload.':'Publish failed: '+((e&&(e.message||e.code))||'unknown error'),'err')});
}
function initAdmin(){
 try{
  if(!window.claude||typeof claude.use!=='function')return;
  claude.use('user').then(function(u){
   if(!u)return;
   return Promise.all([u.isOwner(),u.canEdit()]).then(function(r){
    if(!(r[0]||r[1]))return;
    return claude.use('artifact').then(function(a){
     if(!a)return;artifactNS=a;
     return claude.use('assets').then(function(s){assetsNS=s}).catch(function(){}).then(mountAdmin);
    });
   });
  }).catch(function(){});
 }catch(e){}
}

/* ============ init ============ */
function init(){
 applyTheme();$('#app').innerHTML=shell();
 bg.c=$('#bg');bg.x=bg.c.getContext('2d');bgResize();
 renderContent(false);
 window.addEventListener('resize',bgResize);
 window.addEventListener('scroll',onScroll,{passive:true});
 window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.nx=(e.clientX/innerWidth-.5)*2;mouse.ny=(e.clientY/innerHeight-.5)*2});
 document.addEventListener('mouseover',function(e){var r=$('#cring');if(r)r.classList.toggle('big',!!(e.target.closest&&e.target.closest('a,button,.pc,input,textarea,summary')))});
 $('#modal').addEventListener('click',function(e){
  if(e.target.closest('[data-close]')||e.target===$('#modal'))return closeCase();
  var g=e.target.closest('[data-go]');if(g)openCase(+g.dataset.go);
 });
 document.addEventListener('keydown',function(e){
  if(curCase<0)return;
  if(e.key==='Escape')closeCase();
  if(e.key==='ArrowRight')openCase((curCase+1)%D.projects.length);
  if(e.key==='ArrowLeft')openCase((curCase-1+D.projects.length)%D.projects.length);
 });
 typeTick();requestAnimationFrame(loop);start();initAdmin();
}
init();
})();
</script></body></html>
